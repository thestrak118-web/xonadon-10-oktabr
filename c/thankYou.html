<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ebe8e3">
<meta name="robots" content="noindex,follow">
<title>90% tayyor karopka xonadon — bo‘lib to‘lashga — oxirgi qadam</title>
<link rel="preload" href="./fonts/thanks-bebas.woff2" as="font" type="font/woff2" crossorigin>
<style>@font-face{font-family:"ThanksBebas";src:url( "./fonts/thanks-bebas.woff2" );font-weight:400;font-display:swap}body.thankyou-page{margin:0;background:#ebe8e3;color:#000;font:400 17px / 1.5 Arial,system-ui,sans-serif}.thankyou-page *{box-sizing:border-box}.thankyou-page [hidden]{display:none!important}.ty-main{min-height:100vh;padding:180px 20px 30px}.ty-container{width:100%;max-width:631px;margin:0 auto;text-align:center}.ty-title{margin:0 auto 25px;max-width:622px;font:400 96px / 1 "ThanksBebas" ,Impact,sans-serif;text-transform:uppercase}.ty-copy{margin:0 auto 58px;max-width:522px;font:400 clamp(17px,5vw,29px) / 1.5 Arial,system-ui,sans-serif}.ty-copy span{color:#f00}.ty-action{width:100%;max-width:585px;margin:auto}.ty-arrow{display:block;margin:0 auto 46px;width:16px;height:119px}.ty-button{display:flex;align-items:center;justify-content:center;width:100%;min-height:141px;padding:39px 10px 38px;margin:0 0 42px;border:0;border-radius:30px;background:#039be5;color:#fff;box-shadow:0 5px #006393;text-decoration:none;text-transform:uppercase;font:400 64px / 1 "ThanksBebas" ,Impact,sans-serif}@media(max-width:500px){.ty-main{padding:30% 10px 24px}.ty-title{font-size:40px;margin-bottom:5px}.ty-arrow{width:auto;height:69px;margin-bottom:24px}.ty-button{min-height:75px;max-width:345px;margin:0 auto 25px;padding:23px 10px 20px;font-size:32px}}</style>
<link rel="stylesheet" href="./css/main.css" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="./css/main.css" /></noscript>
</head>
<body class="thankyou-page">
<main class="ty-main">
<section class="ty-container" aria-labelledby="thanks-title">
<h1 class="ty-title" id="thanks-title">Oxirgi qadam qoldi!</h1>
<div id="thanks-content">
<p class="ty-copy">Taqdimot tafsilotlarini olish uchun <br>quyidagi tugma orqali Telegram kanaliga <span>obuna bo‘ling</span></p>
<div class="ty-action">
<img class="ty-arrow" src="./assets/strelka.avif" width="16" height="119" alt="" loading="lazy" decoding="async">
<a class="ty-button" id="telegram" aria-disabled="true" tabindex="-1">obuna bo’lish</a>
</div>
</div>
<div class="ty-feedback">
<p id="thanks-message" role="status" hidden></p>
<p id="status" role="alert" hidden></p>
<p id="channel-status" role="status" hidden></p>
<button id="retry-submit" type="button" hidden>Qayta yuborish</button>
<a id="back-to-webinar" href="./" hidden>Asosiy sahifaga qaytish</a>
</div>
</section>
</main>
<script src="./js/config.js" defer></script>
<script src="./js/thanks.js" defer></script>
<script src="./js/pixel.js" defer></script>
</body>
</html>
